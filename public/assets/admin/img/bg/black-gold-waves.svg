<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Black night with flowing gold waves - login background for the Black Gold theme. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="25%" r="85%">
      <stop offset="0" stop-color="#26272c"/>
      <stop offset="0.5" stop-color="#111114"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="w1" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b8860b" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffd700" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b8860b" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2a2a2e" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1a1a1d" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1500" cy="240" r="280" fill="#ffd700" opacity="0.07" filter="url(#blur)"/>
  <circle cx="360" cy="380" r="300" fill="#b8860b" opacity="0.08" filter="url(#blur)"/>
  <path d="M0 640 C 320 560 560 740 900 660 S 1500 520 1920 610 L1920 1080 L0 1080 Z" fill="url(#w1)"/>
  <path d="M0 740 C 280 690 620 840 980 760 S 1560 650 1920 730 L1920 1080 L0 1080 Z" fill="url(#w2)"/>
  <path d="M0 850 C 360 800 700 930 1060 860 S 1620 780 1920 840 L1920 1080 L0 1080 Z" fill="url(#w3)"/>
  <g fill="none" stroke-width="1.5">
    <path d="M0 600 C 320 520 560 700 900 620 S 1500 480 1920 570" stroke="#ffd700" stroke-opacity="0.45"/>
    <path d="M0 700 C 280 650 620 800 980 720 S 1560 610 1920 690" stroke="#daa520" stroke-opacity="0.30"/>
    <path d="M0 815 C 360 765 700 895 1060 825 S 1620 745 1920 805" stroke="#ffd700" stroke-opacity="0.15"/>
  </g>
</svg>
